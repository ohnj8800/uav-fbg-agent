<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contextual interpretation examples</title>
  <style>
    :root {
      --ink:#18212b; --muted:#66717d; --grid:#d9dee3; --blue:#245fa8;
      --green:#247b4d; --green-bg:#f2faf5; --orange:#c87320; --orange-bg:#fff8ef;
      --gray:#636b75; --gray-bg:#f6f7f8; --red:#b83b4b; --red-bg:#fff5f6;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:#fff; color:var(--ink); font-family:Arial,"Noto Sans",sans-serif; }
    .figure { width:min(1800px,100vw); min-height:650px; margin:auto; padding:25px 45px 22px; position:relative; background:#fff; }
    .panel-label { position:absolute; left:8px; top:0; font-size:38px; font-weight:800; color:#050505; }
    header { text-align:center; margin-bottom:22px; }
    h1 { margin:0 0 7px; font-size:30px; letter-spacing:.005em; }
    .subtitle { color:var(--muted); font-size:15px; }
    .cases { display:grid; grid-template-columns:repeat(3,1fr); gap:34px; }
    .case { min-width:0; }
    .case-head { text-align:center; margin-bottom:9px; }
    .case-head strong { display:block; font-size:19px; }
    .case-head span { display:block; margin-top:3px; color:var(--muted); font-size:12px; }
    canvas { width:100%; height:250px; display:block; background:#fff; }
    .context { position:relative; margin:14px 12px 13px; min-height:58px; border:1.5px solid #83a996; border-radius:9px; background:var(--green-bg); padding:10px 12px; text-align:center; font-size:14px; line-height:1.35; }
    .context::after { content:"↓"; position:absolute; left:50%; bottom:-25px; transform:translateX(-50%); color:#66717d; font-size:19px; }
    .context .label { display:block; color:#52606d; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-bottom:3px; }
    .decision { margin:24px 12px 0; min-height:73px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px; border:2px solid var(--gray); border-radius:10px; background:var(--gray-bg); text-align:center; padding:8px 12px; }
    .decision .label { color:#5d6670; font-size:9px; font-weight:700; letter-spacing:.1em; }
    .decision strong { font-size:14px; overflow-wrap:anywhere; }
    .decision small { color:#5d6670; font-size:11px; }
    .transition .context { border-color:#dba363; background:var(--orange-bg); }
    .transition .decision { border-color:var(--orange); background:var(--orange-bg); }
    .insufficient .context { border-color:#d9959e; background:var(--red-bg); }
    .insufficient .decision { border-color:var(--red); background:var(--red-bg); }
    footer { display:flex; justify-content:center; gap:22px; margin-top:20px; color:#65717d; font-size:11px; }
    footer span + span::before { content:"·"; margin-right:22px; }
    #loading { padding:210px 20px; text-align:center; color:var(--muted); font-size:18px; }
    #error { display:none; margin:120px auto; max-width:760px; border:1px solid #e2a1a9; background:var(--red-bg); color:#842536; padding:24px; border-radius:10px; line-height:1.6; }
    @media (max-width:1000px) {
      .figure { padding:25px; }
      .cases { grid-template-columns:1fr; }
      canvas { height:250px; }
      footer { flex-direction:column; align-items:center; gap:4px; }
      footer span + span::before { content:""; margin:0; }
    }
  </style>
</head>
<body>
  <main class="figure">
    <div class="panel-label">c</div>
    <header>
      <h1>Contextual interpretation examples</h1>
      <div class="subtitle">FBG evidence + verified flight-state context → constrained decision</div>
    </header>
    <div id="loading">Loading verified local results…</div>
    <div id="error"></div>
    <section id="content" hidden>
      <div id="cases" class="cases"></div>
      <footer>
        <span>Development context: verified real state</span>
        <span>Deterministic quality rule cannot be overridden by the LLM</span>
      </footer>
    </section>
  </main>
  <script>
    const caseNotes = {
      W003: {
        order:'Window I', className:'unattributed',
        context:'Preflight · no flight-state transition',
        evidence:'FBG differs from the same-phase baseline'
      },
      W004: {
        order:'Window II', className:'transition',
        context:'ARM transition at 7.071 s',
        evidence:'FBG change occurs near a state transition'
      },
      W027: {
        order:'Window III', className:'insufficient',
        context:'FBG validity 0.30 < 0.80 threshold',
        evidence:'Quality rule stops interpretation'
      }
    };
    const esc = value => String(value).replace(
      /[&<>"']/g,
      character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character])
    );
    const compact = value => {
      const number = Number(value);
      if (!Number.isFinite(number)) return '—';
      if (Math.abs(number) < 0.01 && number !== 0) return number.toExponential(1);
      return number.toFixed(2).replace(/0+$/,'').replace(/\.$/,'');
    };
    async function getJson(url) {
      const response = await fetch(url);
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      return data;
    }
    function drawFbg(canvas, visual) {
      const ratio = window.devicePixelRatio || 1;
      const width = Math.max(420, Math.round(canvas.clientWidth * ratio));
      const height = Math.max(250, Math.round(canvas.clientHeight * ratio));
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      const rows = (visual.samples || []).filter(row => Number.isFinite(row.fbg_delta_nm));
      ctx.scale(ratio, ratio);
      const W = width / ratio, H = height / ratio;
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, W, H);
      if (!rows.length) return;

      const left = 56, right = 12, top = 13, bottom = 34;
      const plotW = W - left - right, plotH = H - top - bottom;
      let low = Math.min(...rows.map(row => row.fbg_delta_nm));
      let high = Math.max(...rows.map(row => row.fbg_delta_nm));
      if (low === high) { low -= 0.5; high += 0.5; }
      const pad = (high - low) * 0.08;
      low -= pad;
      high += pad;
      const x = index => left + plotW * index / Math.max(rows.length - 1, 1);
      const y = value => top + plotH - (value - low) / (high - low) * plotH;

      ctx.font = '12px Arial';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      [high, (high + low) / 2, low].forEach(value => {
        const py = y(value);
        ctx.strokeStyle = '#d9dee3';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(left, py);
        ctx.lineTo(W - right, py);
        ctx.stroke();
        ctx.fillStyle = '#66717d';
        ctx.fillText(compact(value), left - 7, py);
      });
      ctx.strokeStyle = '#59636d';
      ctx.beginPath();
      ctx.moveTo(left, top);
      ctx.lineTo(left, H - bottom);
      ctx.lineTo(W - right, H - bottom);
      ctx.stroke();

      ctx.strokeStyle = '#245fa8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      rows.forEach((row, index) => {
        if (index === 0) ctx.moveTo(x(index), y(row.fbg_delta_nm));
        else ctx.lineTo(x(index), y(row.fbg_delta_nm));
      });
      ctx.stroke();

      ctx.fillStyle = '#b83b4b';
      rows.forEach((row, index) => {
        if (!row.fbg_valid) {
          ctx.beginPath();
          ctx.arc(x(index), y(row.fbg_delta_nm), 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      ctx.fillStyle = '#4e5965';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(`${compact(visual.t_start_s)} s`, left, H - 9);
      ctx.textAlign = 'right';
      ctx.fillText(`${compact(visual.t_end_s)} s`, W - right, H - 9);
      ctx.save();
      ctx.translate(15, top + plotH / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.textAlign = 'center';
      ctx.fillText('FBG Δλ (nm)', 0, 0);
      ctx.restore();
    }
    async function load() {
      try {
        const payload = await getJson('/v1/publication');
        const results = payload.representative_windows;
        const visuals = await Promise.all(
          results.map(result => getJson(`/v1/windows/${result.window_id}/visualization`))
        );
        const container = document.getElementById('cases');
        results.forEach((result, index) => {
          const note = caseNotes[result.window_id] || caseNotes.W003;
          const article = document.createElement('article');
          article.className = `case ${note.className}`;
          article.innerHTML = `
            <div class="case-head"><strong>${esc(note.order)}</strong><span>${esc(result.window_id)}</span></div>
            <canvas aria-label="FBG waveform for ${esc(result.window_id)}"></canvas>
            <div class="context"><span class="label">Verified flight-state context</span>${esc(note.context)}<br>${esc(note.evidence)}</div>
            <div class="decision">
              <span class="label">FINAL OUTPUT</span>
              <strong>${esc(result.constrained_decision)}</strong>
              <small>abstain: ${result.abstain ? 'yes' : 'no'} · ${result.llm_invoked ? 'LLM invoked' : 'LLM bypassed'}</small>
            </div>`;
          container.appendChild(article);
          drawFbg(article.querySelector('canvas'), visuals[index]);
        });
        document.getElementById('loading').hidden = true;
        document.getElementById('content').hidden = false;
      } catch (error) {
        document.getElementById('loading').hidden = true;
        const box = document.getElementById('error');
        box.style.display = 'block';
        box.textContent = `Publication view is unavailable: ${error.message}. Run python scripts\\generate_deliverables.py first.`;
      }
    }
    load();
  </script>
</body>
</html>
